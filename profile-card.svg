    .section { fill: #cbd5e1; font-size: 11px; font-weight: 700; letter-spacing: 1.3px; }
    .muted { fill: #9aa7b5; font-size: 12px; }
    .line { stroke: #1f2937; stroke-width: 1; }
  </style>

  <rect x="0" y="0" width="480" height="380" rx="14" fill="url(#panel-bg)" stroke="#2b3444"/>
  <rect x="0" y="0" width="480" height="26" rx="14" fill="#0f172a" stroke="#2b3444"/>

  <g transform="translate(17,10)">
