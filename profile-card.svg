<svg xmlns="http://www.w3.org/2000/svg" width="480" height="380" viewBox="0 0 480 380" role="img" aria-label="Terminal-style profile card for devbytarun">
  <defs>
    <linearGradient id="panel-bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
